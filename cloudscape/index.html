<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cloudscape / 云境 - ROUZHEN</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="mainCanvas"></canvas>

  <div class="ui-overlay">
    <div class="cloud-tools" id="cloudTools">
      <button class="tool-btn active" id="modeCloud" data-type="cloud">画云</button>
      <button class="tool-btn" id="modeDrag" data-type="drag">拖拽</button>
    </div>
    <div class="action-tools">
      <label class="tool-btn upload-btn" title="上传照片">
        上传
        <input type="file" id="bgUploader" accept="image/*" hidden>
      </label>
      <button class="tool-btn" id="clearBtn" title="清空云气">清空</button>
      <button class="tool-btn" id="snapBtn" title="留影截图">截图</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
