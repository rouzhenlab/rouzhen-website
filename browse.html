<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>ROUZHEN · 日志</title>
<style>
  :root {
    --bg: #0a0a0a;
    --card: #141414;
    --border: #262626;
    --text: #d4d4d4;
    --muted: #737373;
    --accent: #a3a3a3;
    --pill-bg: #1a1a1a;
    --pill-active: #2a2a2a;
    --radius: 10px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Noto Sans SC", "Source Han Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }
  .container { max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }

  /* Header */
  .header { margin-bottom: 40px; }
  .header h1 { font-size: 20px; font-weight: 500; letter-spacing: 0.04em; color: #e5e5e5; }
  .header p  { font-size: 14px; color: var(--muted); margin-top: 4px; }

  /* Tags */
  .tag-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px; }
  .tag-pill {
    font-size: 13px; padding: 4px 14px; border-radius: 100px;
    border: 1px solid var(--border); background: var(--pill-bg);
    color: var(--muted); cursor: pointer; user-select: none;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .tag-pill:hover { border-color: #404040; color: #b0b0b0; }
  .tag-pill.active { background: var(--pill-active); border-color: #404040; color: #e5e5e5; }

  /* Count badge */
  .tag-count { font-size: 11px; color: var(--muted); margin-left: 2px; }

  /* Entries */
  .entry-list { display: flex; flex-direction: column; gap: 20px; }
  .entry-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px 22px; transition: border-color 0.2s;
  }
  .entry-card:hover { border-color: #3a3a3a; }
  .entry-date { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .entry-title { font-size: 17px; font-weight: 500; color: #e5e5e5; line-height: 1.4; }
  .entry-title-en { font-size: 14px; color: var(--muted); margin-top: 2px; margin-bottom: 8px; }
  .entry-excerpt { font-size: 14px; color: var(--muted); margin-bottom: 10px; line-height: 1.55; }
  .entry-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .entry-tag { font-size: 12px; color: var(--muted); }
  .entry-tag::before { content: "#"; }

  .entry-lang-links { margin-top: 8px; font-size: 13px; display: flex; gap: 12px; }
  .entry-lang-links a { color: var(--accent); border-bottom: 1px solid transparent; transition: border-color 0.15s; }
  .entry-lang-links a:hover { border-color: var(--accent); }

  /* Empty */
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }

  /* Footer */
  .footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>日志 · Journal</h1>
    <p id="summary">加载中…</p>
  </div>

  <div class="tag-bar" id="tagBar"></div>

  <div class="entry-list" id="entryList"></div>

  <div class="footer" id="footer"></div>

</div>

<script>
/* ================================================================
   browse.html — ROUZHEN Website 纯静态标签聚合页
   ────────────────────────────────────────────────────────────────
   数据源: /journal/data/entries.json  (Publish 层生成的 Website 格式)
   所有浏览、标签筛选、排序在前端完成。
   无 Worker API · 无跨域 · 无 Token · 纯静态。
   ================================================================ */

/* ── State ── */
var allEntries = [];
var allTags = {};       // { "#Tag": count }
var activeTag = "";

/* ── Init ── */
(function init() {
  var params = new URLSearchParams(window.location.search);
  activeTag = params.get("tag") || "";
  fetchEntries();
})();

/* ── Fetch entries.json (static, same domain) ── */
function fetchEntries() {
  fetch("/journal/data/entries.json")
    .then(function(res) {
      if (!res.ok) throw new Error("entries.json " + res.status);
      return res.json();
    })
    .then(function(data) {
      allEntries = data.entries || [];
      computeTags();
      renderAll();
      updateSummary();
    })
    .catch(function(err) {
      console.warn("browse: 无法加载 entries.json —", err.message);
      document.getElementById("entryList").innerHTML =
        '<div class="empty">暂无文章，敬请期待</div>';
      document.getElementById("summary").textContent = "";
    });
}

/* ── Compute tags from entries (pure JS, no server needed) ── */
function computeTags() {
  var map = {};
  allEntries.forEach(function(e) {
    (e.tags || []).forEach(function(t) {
      map[t] = (map[t] || 0) + 1;
    });
  });
  allTags = map;
}

/* ── Filtered entries ── */
function filteredEntries() {
  if (!activeTag) return allEntries;
  return allEntries.filter(function(e) {
    return (e.tags || []).indexOf(activeTag) !== -1;
  });
}

/* ── Render ── */
function renderAll() {
  renderTagBar();
  renderEntries();
}

function renderTagBar() {
  var bar = document.getElementById("tagBar");
  var tags = Object.keys(allTags).sort(function(a, b) {
    return allTags[b] - allTags[a];
  });

  var html = '<span class="tag-pill' + (activeTag ? "" : " active") + '" data-tag="">全部<span class="tag-count">' + allEntries.length + '</span></span>';
  tags.forEach(function(t) {
    var cls = "tag-pill" + (activeTag === t ? " active" : "");
    html += '<span class="' + cls + '" data-tag="' + escAttr(t) + '">' + escHtml(t) + '<span class="tag-count">' + allTags[t] + '</span></span>';
  });
  bar.innerHTML = html;

  bar.querySelectorAll(".tag-pill").forEach(function(el) {
    el.addEventListener("click", function() {
      var t = this.getAttribute("data-tag");
      updateUrl(t);
      activeTag = t;
      renderAll();
    });
  });
}

function renderEntries() {
  var list = document.getElementById("entryList");
  var entries = filteredEntries();

  if (entries.length === 0) {
    list.innerHTML = '<div class="empty">该标签下暂无文章</div>';
    return;
  }

  list.innerHTML = entries.map(function(e) {
    var cnLink = "/journal/" + e.file;
    var enLink = e.fileEn ? ("/journal/" + e.fileEn) : cnLink;
    var tagsHtml = (e.tags || []).map(function(t) {
      return '<span class="entry-tag">' + escHtml(t) + '</span>';
    }).join(" ");

    return '' +
      '<article class="entry-card">' +
        '<div class="entry-date">' + escHtml(e.date) + '</div>' +
        '<a href="' + escAttr(cnLink) + '">' +
          '<div class="entry-title">' + escHtml(e.title) + '</div>' +
        '</a>' +
        (e.titleEn ? '<div class="entry-title-en">' + escHtml(e.titleEn) + '</div>' : '') +
        (e.excerpt ? '<div class="entry-excerpt">' + escHtml(e.excerpt) + '</div>' : '') +
        '<div class="entry-tags">' + tagsHtml + '</div>' +
        '<div class="entry-lang-links">' +
          '<a href="' + escAttr(cnLink) + '">中文</a>' +
          (e.fileEn ? '<a href="' + escAttr(enLink) + '">English</a>' : '') +
        '</div>' +
      '</article>';
  }).join("");
}

function updateSummary() {
  document.getElementById("summary").textContent =
    "共 " + allEntries.length + " 篇文章";
  document.getElementById("footer").textContent =
    "ROUZHEN Journal · 数据来源：/journal/data/entries.json";
}

/* ── URL helpers ── */
function updateUrl(tag) {
  var url = window.location.pathname;
  if (tag) url += "?tag=" + encodeURIComponent(tag);
  window.history.replaceState(null, "", url);
}

/* ── Escape helpers ── */
function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function escAttr(s) {
  return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
</script>
</body>
</html>
