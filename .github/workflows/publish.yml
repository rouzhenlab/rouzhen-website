name: Generate Publish Content

on:
  push:
    branches: [main]
    paths:
      - 'journal/entries/**'
      - 'tools/publisher/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Generate publish content
        run: python tools/publisher/publish.py
      
      - name: Check for changes
        id: check_changes
        run: |
          git add publish/
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: auto-generate publish content [skip ci]"
          git push
      
      - name: Summary
        run: |
          echo "## Publish Content Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f publish/manifest.json ]; then
            echo "Articles processed: $(jq '.articles | length' publish/manifest.json)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Output Files" >> $GITHUB_STEP_SUMMARY
            echo "| Category | Files |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            for cat in Long Image Photo Micro; do
              count=$(ls -1 publish/$cat 2>/dev/null | wc -l)
              echo "| $cat | $count |" >> $GITHUB_STEP_SUMMARY
            done
          fi