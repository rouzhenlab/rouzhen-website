  <style>
    /* Journal Specific Styles */
    .journal-header {
      padding: var(--space-10) var(--space-3) var(--space-6);
      text-align: center;
      min-height: 30vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .journal-title {
      font-family: var(--font-heading);
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: var(--color-text-primary);
      margin-bottom: var(--space-4);
      letter-spacing: 0.1em;
    }

    .journal-subtitle {
      font-family: var(--font-body);
      font-size: var(--space-4);
      color: var(--color-text-secondary);
      max-width: var(--container-narrow);
      line-height: 1.8;
    }

    /* ── Tag Filter Bar ── */
    .tag-filter-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--space-2);
      max-width: var(--container-narrow);
      margin: 0 auto var(--space-6);
      padding: 0 var(--space-3);
    }

    .tag-filter-bar:empty {
      display: none;
    }

    .tag-pill {
      font-family: var(--font-body);
      font-size: 0.875rem;
      color: var(--color-moss);
      background: transparent;
      padding: var(--space-1) var(--space-3);
      border: 1px solid var(--color-moss);
      border-radius: var(--radius-sm);
      cursor: pointer;
      user-select: none;
      transition: background var(--transition-fast), color var(--transition-fast);
    }

    .tag-pill:hover {
      background: rgba(107, 124, 94, 0.06);
    }

    .tag-pill.active {
      background: var(--color-moss);
      color: var(--color-text-light);
    }

    .tag-count {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-left: 2px;
    }

    .tag-pill.active .tag-count {
      opacity: 0.85;
    }

    /* ── Journal Content ── */
    .journal-content {
      padding: 0 var(--space-3) var(--space-10);
      max-width: var(--container-max);
      margin: 0 auto;
    }

    .journal-entries {
      display: grid;
      gap: var(--space-6);
      max-width: var(--container-narrow);
      margin: 0 auto;
    }

    .journal-entry {
      border-bottom: 1px solid var(--color-border);
      padding-bottom: var(--space-6);
      transition: opacity var(--transition-base);
    }

    .journal-entry:hover {
      opacity: 0.8;
    }

    .journal-entry-date {
      font-family: var(--font-body);
      font-size: var(--space-3);
      color: var(--color-text-muted);
      margin-bottom: var(--space-2);
      letter-spacing: 0.05em;
    }

    .journal-entry-title {
      font-family: var(--font-heading);
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      color: var(--color-text-primary);
      margin-bottom: var(--space-3);
      text-decoration: none;
      display: block;
    }

    .journal-entry-title:hover {
      color: var(--color-moss);
    }

    .journal-entry-excerpt {
      font-family: var(--font-body);
      font-size: var(--space-3);
      color: var(--color-text-secondary);
      line-height: 1.8;
    }

    .journal-entry-tags {
      display: flex;
      gap: var(--space-2);
      margin-top: var(--space-3);
      flex-wrap: wrap;
    }

    .journal-tag {
      font-family: var(--font-body);
      font-size: 0.875rem;
      color: var(--color-moss);
      padding: var(--space-1) var(--space-2);
      border: 1px solid var(--color-moss);
      border-radius: var(--radius-sm);
      background: transparent;
      cursor: pointer;
      transition: background var(--transition-fast), color var(--transition-fast);
    }

    .journal-tag:hover {
      background: rgba(107, 124, 94, 0.06);
    }

    .journal-empty {
      text-align: center;
      padding: var(--space-10) var(--space-3);
      color: var(--color-text-muted);
    }

    .journal-empty-text {
      font-family: var(--font-body);
      font-size: var(--space-4);
      line-height: 1.8;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .journal-header {
        padding: var(--space-8) var(--space-3) var(--space-5);
        min-height: 25vh;
      }

      .journal-content {
        padding: 0 var(--space-3) var(--space-8);
      }

      .tag-filter-bar {
        margin-bottom: var(--space-5);
      }
    }

    /* ── Bottom navigation — same pattern as article pages ── */
    .journal-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-3);
      max-width: var(--container-narrow);
      margin: var(--space-6) auto;
      padding: var(--space-5) var(--space-3);
      border-top: 1px solid var(--color-border);
    }

    .journal-nav-back {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      font-family: var(--font-body);
      font-size: 0.875rem;
      color: var(--color-text-secondary);
      text-decoration: none;
      padding: var(--space-2) var(--space-3);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: transparent;
    }

    .journal-nav-back:hover {
      color: var(--color-moss);
      border-color: var(--color-moss);
    }

    @media (max-width: 640px) {
      .journal-nav {
        padding: var(--space-4) var(--space-3);
      }
    }
  </style>

  <script>
    // Journal Entry Loader —— v0.10.0 (Tag-resolved)
    // Phase 2: 标签渲染/筛选全部通过 TagResolver → tags.json 驱动
    // ── URL: ?tag={id}  ── Display: tags.json[cn|en]
    // ── 未知 Tag → console.warn + 显示原始值（graceful fallback）

    var ALL_ENTRIES = [];
    var ACTIVE_ID = "";       // 当前筛选的 Tag ID（非原始字符串）
    var ENTRY_TAG_IDS = {};  // { entryIndex: [id, ...] }  预计算的已解析标签 ID
    var TAG_COUNTS = {};     // { id: count }  用于筛选栏排序

    function escapeHtml(str) {
      var div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }

    function escapeAttr(str) {
      return String(str).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function formatDateDisplay(dateStr) {
      return (dateStr || "").replace(/-/g, ".");
    }

    function showDebug() {
      var d = document.getElementById("debugInfo");
      if (!d) return;
      d.style.display = "block";
      var sampleEntry = ALL_ENTRIES[0];
      var sampleResolved = sampleEntry ? TagResolver.resolveMany(sampleEntry.tags || []) : [];
      d.innerHTML =
        "<b>TagResolver loaded:</b> " + TagResolver.isLoaded() +
        " | <b>TAG_DICT size:</b> " + TagResolver._tagCount() +
        " | <b>Entries:</b> " + ALL_ENTRIES.length +
        "<br><b>TAG_COUNTS:</b> " + JSON.stringify(TAG_COUNTS) +
        "<br><b>Entry[0] tags:</b> " + JSON.stringify(sampleEntry ? sampleEntry.tags : null) +
        " → " + JSON.stringify(sampleResolved);
    }

    function currentLang() {
      return document.body.classList.contains("lang-en") ? "en" : "cn";
    }

    /* ── 为每篇文章预计算 Tag ID ── */
    function computeEntryTags() {
      ENTRY_TAG_IDS = {};
      TAG_COUNTS = {};
      ALL_ENTRIES.forEach(function(entry, i) {
        var ids = entry.tags || [];
        ENTRY_TAG_IDS[i] = ids;
        ids.forEach(function(id) {
          TAG_COUNTS[id] = (TAG_COUNTS[id] || 0) + 1;
        });
      });
    }

    /* ── 筛选后的条目 ── */
    function filteredEntries() {
      if (!ACTIVE_ID) return ALL_ENTRIES;
      return ALL_ENTRIES.filter(function(entry, i) {
        return (ENTRY_TAG_IDS[i] || []).indexOf(ACTIVE_ID) !== -1;
      });
    }

    /* ── 构建文章卡片 ── */
    function buildEntryCard(entry, i) {
      var article = document.createElement("article");
      article.className = "journal-entry";
      var lang = currentLang();

      var ids = ENTRY_TAG_IDS[i] || [];
      var tagsHtml = ids.map(function(id) {
        var name = TagResolver.displayName(id, lang);
        return '<span class="journal-tag" data-tag-id="' + escapeAttr(id) + '" data-en="' + escapeAttr(TagResolver.displayName(id, 'en')) + '" data-cn="' + escapeAttr(TagResolver.displayName(id, 'cn')) + '">' + escapeHtml(name) + '</span>';
      }).join("\n            ");

      article.innerHTML =
        '<div class="journal-entry-date">' + formatDateDisplay(entry.date) + '</div>\n' +
        '        <a href="/journal/' + escapeAttr(entry.file) + '" class="journal-entry-title"\n' +
        '           data-cn-href="/journal/' + escapeAttr(entry.file) + '"\n' +
        '           data-en-href="/journal/' + escapeAttr(entry.fileEn || entry.file) + '"\n' +
        '           data-en="' + escapeAttr(entry.titleEn) + '" data-cn="' + escapeAttr(entry.title) + '">' + escapeHtml(entry.title) + '</a>\n' +
        '        <p class="journal-entry-excerpt" data-en="' + escapeAttr(entry.excerptEn || entry.excerpt || '') + '" data-cn="' + escapeAttr(entry.excerpt || '') + '">' + escapeHtml(entry.excerpt || '') + '</p>\n' +
        '        <div class="journal-entry-tags">\n            ' + tagsHtml + '\n        </div>';

      article.querySelectorAll(".journal-tag").forEach(function(el) {
        el.addEventListener("click", function(e) {
          e.preventDefault();
          setFilter(this.getAttribute("data-tag-id"));
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });

      return article;
    }

    /* ── 筛选栏（Tag ID → tags.json Display Name）── */
    function renderTagBar() {
      var bar = document.getElementById("tagFilterBar");
      var ids = Object.keys(TAG_COUNTS).sort(function(a, b) {
        return TAG_COUNTS[b] - TAG_COUNTS[a];
      });
      var lang = currentLang();

      if (ids.length === 0) { bar.innerHTML = ""; return; }

      var html = '<span class="tag-pill' + (ACTIVE_ID ? "" : " active") + '" data-tag-id="">' +
        '<span data-en="All" data-cn="全部">全部</span>' +
        '<span class="tag-count">' + ALL_ENTRIES.length + '</span></span>';

      ids.forEach(function(id) {
        var name = TagResolver.displayName(id, lang);
        var cls = "tag-pill" + (ACTIVE_ID === id ? " active" : "");
        html += '<span class="' + cls + '" data-tag-id="' + escapeAttr(id) + '">' +
          '<span data-en="' + escapeAttr(TagResolver.displayName(id, 'en')) + '"' +
          ' data-cn="' + escapeAttr(TagResolver.displayName(id, 'cn')) + '"' +
          '>' + escapeHtml(name) + '</span>' +
          '<span class="tag-count">' + TAG_COUNTS[id] + '</span></span>';
      });

      bar.innerHTML = html;

      bar.querySelectorAll(".tag-pill").forEach(function(el) {
        el.addEventListener("click", function() {
          setFilter(this.getAttribute("data-tag-id"));
        });
      });

      applyCurrentLanguageTo(bar);
    }

    /* ── 渲染文章列表 ── */
    function renderEntries() {
      var container = document.getElementById("journalEntries");
      var emptyState = document.getElementById("journalEmpty");
      var entries = filteredEntries();

      container.innerHTML = "";

      if (entries.length === 0) {
        emptyState.hidden = false;
        return;
      }

      emptyState.hidden = true;
      entries.forEach(function(entry, i) {
        var globalIndex = ALL_ENTRIES.indexOf(entry);
        container.appendChild(buildEntryCard(entry, globalIndex));
      });
      applyCurrentLanguageTo(container);
    }

    /* ── 设置标签筛选（ID 驱动）── */
    function setFilter(id) {
      ACTIVE_ID = id;
      updateUrl(id);
      renderTagBar();
      renderEntries();
    }

    /* ── URL 参数（使用 ID，非原始字符串）── */
    function updateUrl(id) {
      var url = window.location.pathname.replace(/\/$/, "");
      if (id) url += "?tag=" + encodeURIComponent(id);
      window.history.replaceState(null, "", url);
    }

    function readUrlTag() {
      var params = new URLSearchParams(window.location.search);
      return params.get("tag") || "";
    }

    /* ── 语言适配（通用）── */
    function applyCurrentLanguageTo(container) {
      var lang = currentLang();
      container.querySelectorAll("[data-en][data-cn]").forEach(function(el) {
        el.textContent = el.getAttribute("data-" + lang);
      });
      container.querySelectorAll("[data-en-href][data-cn-href]").forEach(function(el) {
        el.setAttribute("href", el.getAttribute("data-" + lang + "-href"));
      });
    }

    /* ── 入口 ── */
    document.addEventListener("DOMContentLoaded", function() {
      var emptyState = document.getElementById("journalEmpty");

      TagResolver.onReady(function() {

        fetch("/journal/data/entries.json")
          .then(function(res) {
            if (!res.ok) throw new Error("entries.json " + res.status);
            return res.json();
          })
          .then(function(data) {
            ALL_ENTRIES = (data.entries || [])
              .filter(function(e) { return e.published !== false; })
              .sort(function(a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });

            if (ALL_ENTRIES.length === 0) {
              emptyState.hidden = false;
              return;
            }

            computeEntryTags();
            ACTIVE_ID = readUrlTag();
            renderTagBar();
            renderEntries();
            showDebug();
          })
          .catch(function() {
            emptyState.hidden = false;
          });

      });

      // 启动加载 tags.json
      TagResolver.load();
    });
  </script>
