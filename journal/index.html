    /* Journal Specific Styles */
    .journal-header {
      padding: var(--space-10) var(--space-3) var(--space-8);
      text-align: center;
      min-height: 40vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .journal-title {
      font-family: var(--font-heading);
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: var(--color-text-primary);
      margin-bottom: var(--space-4);
      letter-spacing: 0.1em;
    }

    .journal-subtitle {
      font-family: var(--font-body);
      font-size: var(--space-4);
      color: var(--color-text-secondary);
      max-width: var(--container-narrow);
      line-height: 1.8;
    }

    .journal-content {
      padding: 0 var(--space-3) var(--space-10);
      max-width: var(--container-max);
      margin: 0 auto;
    }

    .journal-entries {
      display: grid;
      gap: var(--space-6);
      max-width: var(--container-narrow);
      margin: 0 auto;
    }

    .journal-entry {
      border-bottom: 1px solid var(--color-border);
      padding-bottom: var(--space-6);
      transition: opacity var(--transition-base);
    }

    .journal-entry:hover {
      opacity: 0.8;
    }

    .journal-entry-date {
      font-family: var(--font-body);
      font-size: var(--space-3);
      color: var(--color-text-muted);
      margin-bottom: var(--space-2);
      letter-spacing: 0.05em;
    }

    .journal-entry-title {
      font-family: var(--font-heading);
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      color: var(--color-text-primary);
      margin-bottom: var(--space-3);
      text-decoration: none;
      display: block;
    }

    .journal-entry-title:hover {
      color: var(--color-moss);
    }

    .journal-entry-excerpt {
      font-family: var(--font-body);
      font-size: var(--space-3);
      color: var(--color-text-secondary);
      line-height: 1.8;
    }

    .journal-entry-tags {
      display: flex;
      gap: var(--space-2);
      margin-top: var(--space-3);
      flex-wrap: wrap;
    }

    .journal-tag {
      font-family: var(--font-body);
      font-size: 0.875rem;
      color: var(--color-moss);
      padding: var(--space-1) var(--space-2);
      border: 1px solid var(--color-moss);
      border-radius: var(--radius-sm);
    }

    .journal-empty {
      text-align: center;
      padding: var(--space-10) var(--space-3);
      color: var(--color-text-muted);
    }

    .journal-empty-text {
      font-family: var(--font-body);
      font-size: var(--space-4);
      line-height: 1.8;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .journal-header {
        padding: var(--space-8) var(--space-3) var(--space-6);
        min-height: 30vh;
      }

      .journal-content {
        padding: 0 var(--space-3) var(--space-8);
      }
    }

  <script>
    // Journal Entry Loader —— v0.8.0
    // 从 journal/data/entries.json 动态渲染卡片，不再维护写死的文章列表

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }

    function formatDateDisplay(dateStr) {
      return (dateStr || "").replace(/-/g, ".");
    }

    function buildEntryCard(entry) {
      const article = document.createElement("article");
      article.className = "journal-entry";

      const tagsHtml = (entry.tags || [])
        .map((tag, i) => {
          const tagEn = (entry.tagsEn && entry.tagsEn[i]) || tag;
          return `<span class="journal-tag" data-en="${escapeHtml(tagEn)}" data-cn="${escapeHtml(tag)}">${escapeHtml(tag)}</span>`;
        })
        .join("\n            ");

      article.innerHTML = `
        <div class="journal-entry-date">${formatDateDisplay(entry.date)}</div>
        <a href="/journal/${escapeHtml(entry.file)}" class="journal-entry-title"
           data-cn-href="/journal/${escapeHtml(entry.file)}"
           data-en-href="/journal/${escapeHtml(entry.fileEn || entry.file)}"
           data-en="${escapeHtml(entry.titleEn)}" data-cn="${escapeHtml(entry.title)}">${escapeHtml(entry.title)}</a>
        <p class="journal-entry-excerpt" data-en="${escapeHtml(entry.excerptEn)}" data-cn="${escapeHtml(entry.excerpt)}">${escapeHtml(entry.excerpt)}</p>
        <div class="journal-entry-tags">
            ${tagsHtml}
        </div>
      `;
      return article;
    }

    // 跟 main.js 里的语言应用逻辑保持一致，只是只作用于新插入的这些卡片：
    // main.js 的语言初始化只在页面首次加载时跑一次，卡片是异步 fetch 完才插入的，
    // 会错过那一次，所以插入后要照着 <body> 上已经确定的语言 class 手动补一次。
    function applyCurrentLanguageTo(container) {
      const lang = document.body.classList.contains("lang-en") ? "en" : "cn";
      container.querySelectorAll("[data-en][data-cn]").forEach((el) => {
        el.textContent = el.getAttribute("data-" + lang);
      });
      container.querySelectorAll("[data-en-href][data-cn-href]").forEach((el) => {
        el.setAttribute("href", el.getAttribute("data-" + lang + "-href"));
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("journalEntries");
      const emptyState = document.getElementById("journalEmpty");

      fetch("/journal/data/entries.json")
        .then((res) => {
          if (!res.ok) throw new Error("entries.json 加载失败");
          return res.json();
        })
        .then((data) => {
          const entries = (data.entries || [])
            .filter((e) => e.published !== false)
            .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0)); // date DESC，最新在前

          if (entries.length === 0) {
            emptyState.hidden = false;
            return;
          }

          entries.forEach((entry) => container.appendChild(buildEntryCard(entry)));
          applyCurrentLanguageTo(container);
        })
        .catch(() => {
          emptyState.hidden = false;
        });
    });
  </script>
