<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal · 日志 — ROUZHEN</title>
  <meta name="description" content="ROUZHEN Journal — 写作、思考、创作。">
  <link rel="icon" type="image/svg+xml" href="/assets/svg/favicon.svg">
  <link rel="canonical" href="https://rouzhen.pages.dev/journal/">

  <!-- 引用主站样式，保持视觉一致 -->
  <link rel="stylesheet" href="/styles/variables.css">
  <link rel="stylesheet" href="/styles/typography.css">
  <link rel="stylesheet" href="/styles/layout.css">
  <link rel="stylesheet" href="/components/Navigation/Navigation.css">

  <style>
    /* Journal 页面专用微调 — 只加必要的，不重复定义 */
    .journal-page {
      padding-top: 120px;       /* 给固定导航栏留空间 */
      padding-bottom: var(--space-9);
    }

    /* Sticky Footer —— 内容少时把 footer 推到底部 */
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    main {
      flex: 1;
    }

    /* Journal Specific Styles */

    .journal-header {
      margin-bottom: var(--space-7);
    }

    .journal-title {
      font-size: 32px;
      font-weight: 400;
      letter-spacing: 0.15em;
      margin-bottom: var(--space-2);
    }

    .journal-subtitle {
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--color-text-secondary);
      letter-spacing: 0.15em;
      margin-bottom: var(--space-6);
    }

    /* 标签云 */
    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
      margin-bottom: var(--space-6);
      padding-bottom: var(--space-5);
      border-bottom: 1px solid var(--color-border);
    }

    .tag-pill {
      font-family: var(--font-sans);
      font-size: 13px;
      letter-spacing: 0.08em;
      padding: 6px 16px;
      border: 1px solid var(--color-border);
      border-radius: 100px;
      background: none;
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
      text-decoration: none;
      line-height: 1.4;
    }

    .tag-pill:hover,
    .tag-pill.active {
      color: var(--color-text-primary);
      border-color: var(--color-moss-light);
      background: var(--color-paper-warm);
    }

    .tag-pill .count {
      color: var(--color-text-muted);
      font-size: 11px;
      margin-left: 4px;
    }

    /* 语言切换 */
    .lang-toggle {
      display: inline-flex;
      gap: 8px;
      margin-bottom: var(--space-6);
    }

    .lang-toggle button {
      font-family: var(--font-sans);
      font-size: 12px;
      letter-spacing: 0.15em;
      padding: 4px 0;
      border: none;
      background: none;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: color var(--transition-fast);
    }

    .lang-toggle button.active {
      color: var(--color-text-primary);
    }

    .lang-toggle .lang-divider {
      color: var(--color-border);
      font-size: 12px;
    }

    /* 文章列表 */
    .entry-list {
      list-style: none;
    }

    .entry-item {
      padding: var(--space-5) 0;
      border-bottom: 1px solid var(--color-border);
    }

    .entry-item:last-child {
      border-bottom: none;
    }

    .entry-date {
      font-family: var(--font-sans);
      font-size: 12px;
      letter-spacing: 0.15em;
      color: var(--color-text-muted);
      margin-bottom: var(--space-2);
    }

    .entry-title {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.06em;
      line-height: 1.5;
      margin-bottom: var(--space-2);
    }

    .entry-title a {
      color: var(--color-text-primary);
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    .entry-title a:hover {
      color: var(--color-moss);
    }

    .entry-excerpt {
      font-size: 14px;
      color: var(--color-text-secondary);
      line-height: 1.8;
      letter-spacing: 0.02em;
      margin-bottom: var(--space-2);
    }

    .entry-tags {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
    }

    .entry-tag {
      font-family: var(--font-sans);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--color-text-muted);
      padding: 2px 10px;
      border: 1px solid var(--color-border);
      border-radius: 100px;
      background: none;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .entry-tag:hover {
      color: var(--color-moss);
      border-color: var(--color-moss-light);
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: var(--space-7) 0;
    }

    .empty-state p {
      font-family: var(--font-sans);
      font-size: 14px;
      color: var(--color-text-muted);
      letter-spacing: 0.08em;
    }

    .loading-text {
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--color-text-muted);
      letter-spacing: 0.1em;
      text-align: center;
      padding: var(--space-7) 0;
    }

    @media (max-width: 768px) {
      .journal-page {
        padding-top: 100px;
        padding-left: var(--space-4);
        padding-right: var(--space-4);
      }
      .journal-title {
        font-size: 24px;
      }
    }
  </style>
</head>
<body class="journal-page">

  <!-- 最小化导航：复刻主站导航骨架 -->
  <header class="header scrolled" style="position:fixed;background:rgba(255,255,255,0.92);backdrop-filter:blur(10px);pointer-events:auto;">
    <nav class="navbar">
      <div class="nav-logo" style="opacity:1;pointer-events:auto;">
        <a href="/" style="text-decoration:none;">
          <span class="nav-wave" style="color:var(--color-text-primary);">~</span>
        </a>
      </div>
      <ul class="nav-menu" style="opacity:1;pointer-events:auto;">
        <li><a href="/#home" class="nav-link" style="color:var(--color-text-secondary);" data-en="Home" data-cn="首页">Home</a></li>
        <li><a href="/#philosophy" class="nav-link" style="color:var(--color-text-secondary);" data-en="Philosophy" data-cn="理念">Philosophy</a></li>
        <li><a href="/#story" class="nav-link" style="color:var(--color-text-secondary);" data-en="Story" data-cn="故事">Story</a></li>
        <li><a href="/#collections" class="nav-link" style="color:var(--color-text-secondary);" data-en="Collections" data-cn="系列">Collections</a></li>
        <li><a href="/#lab" class="nav-link" style="color:var(--color-text-secondary);" data-en="Lab" data-cn="实验">Lab</a></li>
        <li><a href="/journal/" class="nav-link" style="color:var(--color-text-primary);" data-en="Journal" data-cn="札记">Journal</a></li>
        <li><a href="/#contact" class="nav-link" style="color:var(--color-text-secondary);" data-en="Contact" data-cn="联系">Contact</a></li>
      </ul>
    </nav>
  </header>

  <div class="container-narrow">
    <div class="journal-header">
      <h1 class="journal-title" data-en="Journal" data-cn="日志">Journal · 日志</h1>
      <div class="lang-toggle">
        <button class="active" data-lang="zh" id="btnZh">中文</button>
        <span class="lang-divider">/</span>
        <button data-lang="en" id="btnEn">EN</button>
      </div>
      <p class="journal-subtitle" data-en="Writing, thinking, creating." data-cn="写作、思考、创作。">写作、思考、创作。</p>
    </div>

    <div class="tag-cloud" id="tagCloud">
      <a class="tag-pill active" href="/journal/" data-tag="">全部</a>
    </div>

    <div id="entryContainer">
      <p class="loading-text">Loading…</p>
    </div>
  </div>

  <script>
    (function() {
      var lang = 'zh';
      var activeTag = '';
      var allEntries = [];
      var allTags = [];

      // 从 URL 读取当前标签
      var params = new URLSearchParams(window.location.search);
      activeTag = params.get('tag') || '';

      // 语言切换
      document.getElementById('btnZh').addEventListener('click', function() { switchLang('zh'); });
      document.getElementById('btnEn').addEventListener('click', function() { switchLang('en'); });

      function switchLang(l) {
        lang = l;
        document.getElementById('btnZh').className = l === 'zh' ? 'active' : '';
        document.getElementById('btnEn').className = l === 'en' ? 'active' : '';
        render();
      }

      // 加载数据 — 从 R2 entries.json（Publish 写入，静态 JSON）
      Promise.all([
        fetch('/journal/data/entries.json').then(function(r) { return r.json(); }),
        fetch('/journal/data/tags.json').then(function(r) { return r.json(); })
      ]).then(function(results) {
        var entriesData = results[0];
        var tagsData = results[1];

        allEntries = entriesData.entries || entriesData || [];
        allTags = tagsData.tags || tagsData || [];

        renderTagCloud();
        render();
      }).catch(function(err) {
        console.error('Failed to load journal data:', err);
        document.getElementById('entryContainer').innerHTML =
          '<div class="empty-state"><p>暂无法加载文章，请稍后再试。</p></div>';
      });

      function getTagName(tagId) {
        for (var i = 0; i < allTags.length; i++) {
          if (allTags[i].id === tagId) {
            return lang === 'zh' ? (allTags[i].cn || tagId) : (allTags[i].en || tagId);
          }
        }
        return tagId;
      }

      function renderTagCloud() {
        var html = '<a class="tag-pill' + (activeTag ? '' : ' active') + '" href="/journal/"><span data-en="All" data-cn="全部">全部</span></a>';
        var tagCounts = {};
        for (var i = 0; i < allEntries.length; i++) {
          var entry = allEntries[i];
          if (entry.published === false) continue;
          var tags = entry.tags || entry.tags_cn || [];
          for (var j = 0; j < tags.length; j++) {
            var t = tags[j];
            tagCounts[t] = (tagCounts[t] || 0) + 1;
          }
        }
        for (var i = 0; i < allTags.length; i++) {
          var tag = allTags[i];
          var count = tagCounts[tag.id] || 0;
          if (count === 0) continue;
          var name = lang === 'zh' ? tag.cn : tag.en;
          var isActive = activeTag === tag.id;
          html += '<a class="tag-pill' + (isActive ? ' active' : '') + '" href="/journal/?tag=' + encodeURIComponent(tag.id) + '">' +
            escapeHTML(name) + ' <span class="count">' + count + '</span></a>';
        }
        document.getElementById('tagCloud').innerHTML = html;
      }

      function render() {
        var filtered = allEntries.filter(function(e) {
          if (e.published === false) return false;
          if (!activeTag) return true;
          var tags = e.tags || e.tags_cn || [];
          return tags.indexOf(activeTag) !== -1;
        });

        if (filtered.length === 0) {
          document.getElementById('entryContainer').innerHTML =
            '<div class="empty-state"><p data-en="No articles found." data-cn="暂无文章。">暂无文章。</p></div>';
          return;
        }

        var html = '<ul class="entry-list">';
        for (var i = 0; i < filtered.length; i++) {
          var e = filtered[i];
          var title = lang === 'en' ? (e.titleEn || e.title) : (e.title || e.titleEn);
          var excerpt = lang === 'en' ? (e.excerptEn || e.excerpt || '') : (e.excerpt || e.excerptEn || '');
          var url = e.slug ? '/journal/entries/' + e.slug + (lang === 'en' ? '-en' : '') + '.html' : '#';
          var dateStr = formatDate(e.date);

          var tagsHtml = '';
          var tags = e.tags || e.tags_cn || [];
          for (var j = 0; j < tags.length; j++) {
            var tagName = getTagName(tags[j]);
            tagsHtml += '<a class="entry-tag" href="/journal/?tag=' + encodeURIComponent(tags[j]) + '">' +
              escapeHTML(tagName) + '</a>';
          }

          html += '<li class="entry-item">' +
            '<div class="entry-date">' + escapeHTML(dateStr) + '</div>' +
            '<h3 class="entry-title"><a href="' + url + '">' + escapeHTML(title) + '</a></h3>' +
            (excerpt ? '<p class="entry-excerpt">' + escapeHTML(excerpt) + '</p>' : '') +
            '<div class="entry-tags">' + tagsHtml + '</div>' +
            '</li>';
        }
        html += '</ul>';

        document.getElementById('entryContainer').innerHTML = html;
      }

      function formatDate(d) {
        if (!d) return '';
        var dt = new Date(d + 'T00:00:00Z');
        return dt.getFullYear() + '年' + (dt.getMonth() + 1) + '月' + dt.getDate() + '日';
      }

      function escapeHTML(str) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
      }
    })();
  </script>
</body>
</html>
