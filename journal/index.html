  <style>
    /* Journal Specific Styles */
    .journal-header {
      padding: var(--space-10) var(--space-3) var(--space-6);
      text-align: center;
      min-height: 30vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .journal-title {
      font-family: var(--font-heading);
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: var(--color-text-primary);
      margin-bottom: var(--space-4);
      letter-spacing: 0.1em;
    }

    .journal-subtitle {
      font-family: var(--font-body);
      font-size: var(--space-4);
      color: var(--color-text-secondary);
      max-width: var(--container-narrow);
      line-height: 1.8;
    }

    /* ── Tag Filter Bar ── */
    .tag-filter-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--space-2);
      max-width: var(--container-narrow);
      margin: 0 auto var(--space-6);
      padding: 0 var(--space-3);
    }

    .tag-filter-bar:empty {
      display: none;
    }

    .tag-pill {
      font-family: var(--font-body);
      font-size: 0.875rem;
      color: var(--color-moss);
      background: transparent;
      padding: var(--space-1) var(--space-3);
      border: 1px solid var(--color-moss);
      border-radius: var(--radius-sm);
      cursor: pointer;
      user-select: none;
      transition: background var(--transition-fast), color var(--transition-fast);
    }

    .tag-pill:hover {
      background: rgba(107, 124, 94, 0.06);
    }

    .tag-pill.active {
      background: var(--color-moss);
      color: var(--color-text-light);
    }

    .tag-count {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-left: 2px;
    }

    .tag-pill.active .tag-count {
      opacity: 0.85;
    }

    /* ── Journal Content ── */
    .journal-content {
      padding: 0 var(--space-3) var(--space-10);
      max-width: var(--container-max);
      margin: 0 auto;
    }

    .journal-entries {
      display: grid;
      gap: var(--space-6);
      max-width: var(--container-narrow);
      margin: 0 auto;
    }

    .journal-entry {
      border-bottom: 1px solid var(--color-border);
      padding-bottom: var(--space-6);
      transition: opacity var(--transition-base);
    }

    .journal-entry:hover {
      opacity: 0.8;
    }

    .journal-entry-date {
      font-family: var(--font-body);
      font-size: var(--space-3);
      color: var(--color-text-muted);
      margin-bottom: var(--space-2);
      letter-spacing: 0.05em;
    }

    .journal-entry-title {
      font-family: var(--font-heading);
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      color: var(--color-text-primary);
      margin-bottom: var(--space-3);
      text-decoration: none;
      display: block;
    }

    .journal-entry-title:hover {
      color: var(--color-moss);
    }

    .journal-entry-excerpt {
      font-family: var(--font-body);
      font-size: var(--space-3);
      color: var(--color-text-secondary);
      line-height: 1.8;
    }

    .journal-entry-tags {
      display: flex;
      gap: var(--space-2);
      margin-top: var(--space-3);
      flex-wrap: wrap;
    }

    .journal-tag {
      font-family: var(--font-body);
      font-size: 0.875rem;
      color: var(--color-moss);
      padding: var(--space-1) var(--space-2);
      border: 1px solid var(--color-moss);
      border-radius: var(--radius-sm);
      background: transparent;
      cursor: pointer;
      transition: background var(--transition-fast), color var(--transition-fast);
    }

    .journal-tag:hover {
      background: rgba(107, 124, 94, 0.06);
    }

    .journal-empty {
      text-align: center;
      padding: var(--space-10) var(--space-3);
      color: var(--color-text-muted);
    }

    .journal-empty-text {
      font-family: var(--font-body);
      font-size: var(--space-4);
      line-height: 1.8;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .journal-header {
        padding: var(--space-8) var(--space-3) var(--space-5);
        min-height: 25vh;
      }

      .journal-content {
        padding: 0 var(--space-3) var(--space-8);
      }

      .tag-filter-bar {
        margin-bottom: var(--space-5);
      }
    }
  </style>

  <script>
    // Journal Entry Loader —— v0.9.0
    // 从 journal/data/entries.json 动态渲染卡片，支持标签筛选
    // ────────────────────────────────────────────────────────────────
    //  纯静态：只读 entries.json，标签计算 + 筛选全在前端。
    //  无 Worker · 无 API · 无 Token · 无跨域。

    var ALL_ENTRIES = [];
    var ALL_TAGS = {};       // { "#Tag": count }
    var ACTIVE_TAG = "";

    function escapeHtml(str) {
      var div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }

    function escapeAttr(str) {
      return String(str).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function formatDateDisplay(dateStr) {
      return (dateStr || "").replace(/-/g, ".");
    }

    /* ── 筛选后的条目 ── */
    function filteredEntries() {
      if (!ACTIVE_TAG) return ALL_ENTRIES;
      return ALL_ENTRIES.filter(function(e) {
        return (e.tags || []).indexOf(ACTIVE_TAG) !== -1;
      });
    }

    /* ── 统计所有 tag 出现次数 ── */
    function computeTags() {
      var map = {};
      ALL_ENTRIES.forEach(function(e) {
        (e.tags || []).forEach(function(t) {
          map[t] = (map[t] || 0) + 1;
        });
      });
      ALL_TAGS = map;
    }

    /* ── 构建文章卡片 ── */
    function buildEntryCard(entry) {
      var article = document.createElement("article");
      article.className = "journal-entry";

      var tagsHtml = (entry.tags || []).map(function(tag, i) {
        var tagEn = (entry.tagsEn && entry.tagsEn[i]) || tag;
        return '<span class="journal-tag" data-en="' + escapeAttr(tagEn) + '" data-cn="' + escapeAttr(tag) + '" data-tag="' + escapeAttr(tag) + '">' + escapeHtml(tag) + '</span>';
      }).join("\n            ");

      article.innerHTML =
        '<div class="journal-entry-date">' + formatDateDisplay(entry.date) + '</div>\n' +
        '        <a href="/journal/' + escapeAttr(entry.file) + '" class="journal-entry-title"\n' +
        '           data-cn-href="/journal/' + escapeAttr(entry.file) + '"\n' +
        '           data-en-href="/journal/' + escapeAttr(entry.fileEn || entry.file) + '"\n' +
        '           data-en="' + escapeAttr(entry.titleEn) + '" data-cn="' + escapeAttr(entry.title) + '">' + escapeHtml(entry.title) + '</a>\n' +
        '        <p class="journal-entry-excerpt" data-en="' + escapeAttr(entry.excerptEn || entry.excerpt || '') + '" data-cn="' + escapeAttr(entry.excerpt || '') + '">' + escapeHtml(entry.excerpt || '') + '</p>\n' +
        '        <div class="journal-entry-tags">\n            ' + tagsHtml + '\n        </div>';

      // 文章卡片里的 tag 点击 → 跳转到对应筛选
      article.querySelectorAll(".journal-tag").forEach(function(el) {
        el.addEventListener("click", function(e) {
          e.preventDefault();
          var t = this.getAttribute("data-tag");
          setFilter(t);
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });

      return article;
    }

    /* ── 渲染标签筛选栏 ── */
    function renderTagBar() {
      var bar = document.getElementById("tagFilterBar");
      var tags = Object.keys(ALL_TAGS).sort(function(a, b) {
        return ALL_TAGS[b] - ALL_TAGS[a];
      });

      if (tags.length === 0) { bar.innerHTML = ""; return; }

      var html = '<span class="tag-pill' + (ACTIVE_TAG ? "" : " active") + '" data-tag="">' +
        '<span data-en="All" data-cn="全部">全部</span>' +
        '<span class="tag-count">' + ALL_ENTRIES.length + '</span></span>';

      tags.forEach(function(t) {
        var cls = "tag-pill" + (ACTIVE_TAG === t ? " active" : "");
        html += '<span class="' + cls + '" data-tag="' + escapeAttr(t) + '">' +
          escapeHtml(t) + '<span class="tag-count">' + ALL_TAGS[t] + '</span></span>';
      });

      bar.innerHTML = html;

      bar.querySelectorAll(".tag-pill").forEach(function(el) {
        el.addEventListener("click", function() {
          setFilter(this.getAttribute("data-tag"));
        });
      });

      // 语言适配
      applyCurrentLanguageTo(bar);
    }

    /* ── 渲染文章列表 ── */
    function renderEntries() {
      var container = document.getElementById("journalEntries");
      var emptyState = document.getElementById("journalEmpty");
      var entries = filteredEntries();

      container.innerHTML = "";

      if (entries.length === 0) {
        emptyState.hidden = false;
        return;
      }

      emptyState.hidden = true;
      entries.forEach(function(entry) {
        container.appendChild(buildEntryCard(entry));
      });
      applyCurrentLanguageTo(container);
    }

    /* ── 设置标签筛选 ── */
    function setFilter(tag) {
      ACTIVE_TAG = tag;
      updateUrl(tag);
      renderTagBar();
      renderEntries();
    }

    /* ── URL 参数 ── */
    function updateUrl(tag) {
      var url = window.location.pathname.replace(/\/$/, "");
      if (tag) url += "?tag=" + encodeURIComponent(tag);
      window.history.replaceState(null, "", url);
    }

    function readUrlTag() {
      var params = new URLSearchParams(window.location.search);
      return params.get("tag") || "";
    }

    /* ── 语言适配 ── */
    function applyCurrentLanguageTo(container) {
      var lang = document.body.classList.contains("lang-en") ? "en" : "cn";
      container.querySelectorAll("[data-en][data-cn]").forEach(function(el) {
        el.textContent = el.getAttribute("data-" + lang);
      });
      container.querySelectorAll("[data-en-href][data-cn-href]").forEach(function(el) {
        el.setAttribute("href", el.getAttribute("data-" + lang + "-href"));
      });
    }

    /* ── 入口 ── */
    document.addEventListener("DOMContentLoaded", function() {
      var emptyState = document.getElementById("journalEmpty");

      fetch("/journal/data/entries.json")
        .then(function(res) {
          if (!res.ok) throw new Error("entries.json " + res.status);
          return res.json();
        })
        .then(function(data) {
          ALL_ENTRIES = (data.entries || [])
            .filter(function(e) { return e.published !== false; })
            .sort(function(a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });

          if (ALL_ENTRIES.length === 0) {
            emptyState.hidden = false;
            return;
          }

          computeTags();
          ACTIVE_TAG = readUrlTag();
          renderTagBar();
          renderEntries();
        })
        .catch(function() {
          emptyState.hidden = false;
        });
    });
  </script>
